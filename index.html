<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>薄荷绿专注钟</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        :root {
            --main-color: #a8e6cf; 
            --glow-color: #7fffd4; 
            --bg-dark: #0a1410;    
            --glass-bg: rgba(20, 40, 30, 0.4);
            --glass-border: rgba(168, 230, 207, 0.2);
        }
        
        html, body {
            margin: 0; padding: 0; background-color: var(--bg-dark); font-family: "PingFang SC", "Noto Serif SC", sans-serif;
            overflow: hidden; height: 100%; height: 100dvh; user-select: none; -webkit-touch-callout: none;
            background-image: radial-gradient(circle at 50% 50%, rgba(20, 50, 35, 0.5) 0%, var(--bg-dark) 80%);
        }
        
        #netlify-badge, [id*="netlify"], [class*="netlify"], iframe[title*="Netlify"], a[href*="netlify.com"] { 
            display: none !important; opacity: 0 !important; pointer-events: none !important; 
            height: 0 !important; width: 0 !important; z-index: -9999 !important; visibility: hidden !important;
        }

        #edge-glow { position: fixed; top: 0; left: 0; width: 100vw; height: 100%; pointer-events: none; z-index: 1; box-shadow: inset 0 0 40px 10px rgba(168, 230, 207, 0.05); animation: breathe 6s ease-in-out infinite alternate; }
        @keyframes breathe { 0% { box-shadow: inset 0 0 30px 5px rgba(168, 230, 207, 0.05); } 100% { box-shadow: inset 0 0 70px 20px rgba(168, 230, 207, 0.2); } }
        
        #main-container { position: relative; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; height: 100%; padding: 20px 20px 40px 20px; box-sizing: border-box; }
        
        .top-bar { display: flex; justify-content: flex-end; gap: 15px; padding-top: env(safe-area-inset-top); }
        
        .icon-btn { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(5px); 
            border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; 
            color: var(--main-color); cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        .icon-btn:active { transform: scale(0.85); background: rgba(168, 230, 207, 0.2); }
        .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

        .timer-section { display: flex; flex-direction: column; align-items: center; gap: 15px; flex: 1; justify-content: center; }
        
        #date-weather {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 6px 16px;
            border-radius: 20px;
            color: var(--main-color);
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .divider { color: rgba(168, 230, 207, 0.4); font-size: 0.8rem; }

        #time-display { font-size: 7.5rem; color: #fff; text-shadow: 0 0 20px rgba(168, 230, 207, 0.9), 0 0 40px rgba(127, 255, 212, 0.5); font-weight: 300; letter-spacing: 2px; font-variant-numeric: tabular-nums; z-index: 2; margin-bottom: 10px; }
        
        .time-adjust { display: flex; gap: 15px; z-index: 2; }
        .time-adjust button { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(5px); color: var(--main-color); padding: 6px 18px; border-radius: 20px; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
        .time-adjust button:active { background: rgba(168, 230, 207, 0.2); }
        
        .btn-group { display: flex; gap: 20px; margin-top: 10px; z-index: 2; }
        .main-btn { background: rgba(168, 230, 207, 0.1); border: 1.5px solid var(--main-color); color: var(--main-color); padding: 14px 35px; border-radius: 30px; font-size: 1.1rem; cursor: pointer; transition: all 0.3s; box-shadow: 0 0 20px rgba(168, 230, 207, 0.2); outline: none; font-weight: bold; letter-spacing: 2px; }
        .main-btn:active { transform: scale(0.9); background: var(--main-color); color: #000; box-shadow: 0 0 30px rgba(168, 230, 207, 0.6); }

        .bottom-panel { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 15px; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); margin-bottom: 10px; }
        
        .music-player { display: none; flex-direction: column; gap: 12px; align-items: center;}
        .music-info { color: var(--main-color); font-size: 0.95rem; text-shadow: 0 0 5px var(--main-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: center;}
        .music-controls { display: flex; justify-content: center; align-items: center; gap: 30px; }
        .music-btn { background: none; border: none; color: var(--main-color); font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .music-btn:active { transform: scale(0.8); }
        #vol-slider { width: 90%; height: 4px; -webkit-appearance: none; background: rgba(168, 230, 207, 0.2); border-radius: 2px; outline: none; margin-top: 5px; }
        #vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--main-color); box-shadow: 0 0 8px var(--main-color); cursor: pointer; }

        .memo { display: none; flex-direction: column; gap: 10px; }
        #memo-text { width: 100%; height: 80px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 12px; color: #e0f7ec; padding: 12px; box-sizing: border-box; outline: none; resize: none; font-family: inherit; font-size: 0.9rem; }
        #memo-text::placeholder { color: rgba(168, 230, 207, 0.3); }
        .save-btn { align-self: flex-end; background: var(--main-color); color: #000; border: none; padding: 6px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .save-btn:active { transform: scale(0.9); }

        #fx-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100%; pointer-events: none; z-index: 5; overflow: hidden; }
        .falling-item { position: absolute; top: -15vh; display: flex; align-items: center; justify-content: center; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
        @keyframes fall { 0% { transform: translateY(0) translateX(0) rotate(0deg); } 25% { transform: translateY(30vh) translateX(20px) rotate(45deg); } 50% { transform: translateY(60vh) translateX(-20px) rotate(90deg); } 75% { transform: translateY(90vh) translateX(20px) rotate(135deg); } 100% { transform: translateY(130vh) translateX(0) rotate(180deg); } }

        .firefly { position: fixed; width: 4px; height: 4px; background: #7fffd4; border-radius: 50%; box-shadow: 0 0 10px 2px #7fffd4; pointer-events: none; z-index: 2; animation: floatFirefly 8s infinite ease-in-out alternate; opacity: 0; }
        @keyframes floatFirefly { 0% { transform: translate(0, 0); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: translate(30px, -50px); opacity: 0; } }

        .click-fx { 
            position: absolute; pointer-events: none; z-index: 9999; 
            width: 10px; height: 10px; 
            border: 1.5px solid var(--glow-color); 
            border-radius: 50%; 
            box-shadow: 0 0 8px var(--glow-color);
            transform: translate(-50%, -50%);
            animation: rippleOut 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        @keyframes rippleOut { 
            0% { width: 4px; height: 4px; opacity: 1; border-width: 2px; } 
            100% { width: 50px; height: 50px; opacity: 0; border-width: 0.5px; } 
        }

        #bubble { position: fixed; top: 20%; left: 50%; transform: translate(-50%, 10px); background: rgba(13, 21, 18, 0.95); border: 1.5px solid var(--main-color); border-radius: 16px; padding: 15px 25px; color: #e0f7ec; font-size: 1.1rem; box-shadow: 0 0 20px rgba(168, 230, 207, 0.4); opacity: 0; pointer-events: none; z-index: 20; transition: all 0.3s; white-space: nowrap; backdrop-filter: blur(10px); }
        #bubble.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
</head>
<body>
    <div id="edge-glow"></div>
    <div id="fx-container"></div>
    <div id="bubble">去放松一下吧 🌿</div>

    <div id="main-container">
        <div class="top-bar">
            <button class="icon-btn" id="btn-toggle-music">
                <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </button>
            <button class="icon-btn" id="btn-toggle-memo">
                <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
            </button>
        </div>

        <div class="timer-section">
            <div id="date-weather">
                <span id="display-date">加载中...</span>
                <span class="divider">|</span>
                <span id="display-weather">🌿 微风 舒适</span>
            </div>

            <div id="time-display">25:00</div>
            <div class="time-adjust">
                <button id="btn-minus">- 5 min</button>
                <button id="btn-plus">+ 5 min</button>
            </div>
            <div class="btn-group">
                <button class="main-btn" id="btn-start">开始专注</button>
                <button class="main-btn" id="btn-reset">重置</button>
            </div>
        </div>

        <div class="bottom-panel">
            <div class="music-player" id="panel-music">
                <div class="music-info" id="music-title">🎵 尚未播放音乐</div>
                <div class="music-controls">
                    <button class="music-btn" id="music-prev">⏮</button>
                    <button class="music-btn" id="music-play">▶</button>
                    <button class="music-btn" id="music-next">⏭</button>
                </div>
                <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.5">
            </div>

            <div class="memo" id="panel-memo">
                <textarea id="memo-text" placeholder="写下今天要做的任务... (自动保存在本地)"></textarea>
                <button class="save-btn" id="btn-save-memo">保存</button>
            </div>
        </div>
    </div>

    <audio id="bgm" preload="auto"></audio>

    <script>
        const killNetlifyAd = () => {
            const badElements = document.querySelectorAll('a[href*="netlify.com"], iframe[title*="Netlify"], [id*="netlify"], [class*="netlify"]');
            badElements.forEach(el => el.remove());
        };
        killNetlifyAd();
        setInterval(killNetlifyAd, 500);
        new MutationObserver(killNetlifyAd).observe(document.body, { childList: true, subtree: true });

        // 日期计算（纯本地，绝不超时）
        function updateDate() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            const day = days[now.getDay()];
            document.getElementById('display-date').textContent = `${month}月${date}日 ${day}`;
        }
        updateDate();

        // 🌟 多重容错天气接口（防拦截超时） 🌟
        async function fetchWeather() {
            const weatherEl = document.getElementById('display-weather');
            try {
                const controller = new AbortController();
                // 极限超时：1.5秒连不上直接放弃，不卡界面
                const timeoutId = setTimeout(() => controller.abort(), 1500); 
                
                // 尝试使用更轻量的免Key接口 (国内通常能直连)
                const res = await fetch('https://api.vvhan.com/api/weather', { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if(res.ok) {
                    const data = await res.json();
                    if(data.success && data.info) {
                        const city = data.city || '';
                        const temp = data.info.temp || '';
                        const type = data.info.type || '';
                        weatherEl.textContent = `🌿 ${city} ${type} ${temp}`;
                    }
                }
            } catch (e) {
                // 如果连不上，就保持默认的“微风 舒适”，或者随机给个美好天气
                console.log("天气接口被拦截或超时，使用默认显示");
                weatherEl.textContent = `🌿 微风 舒适`;
            }
        }
        fetchWeather();

        // ================= 特效与动效 =================
        const fx = document.getElementById('fx-container');
        const leafSvg = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="#a8e6cf" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 0 4px rgba(168,230,207,0.8));"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"></path><path d="M12 2v20"></path></svg>';
        const cloverHtml = '<span style="color:#a8e6cf;text-shadow:0 0 8px #7fffd4">🍀</span>';
        const sparkleHtml = '<span style="color:#fff;text-shadow:0 0 6px #a8e6cf">✦</span>';
        const particles = [leafSvg, leafSvg, cloverHtml, cloverHtml, sparkleHtml, sparkleHtml];
        
        for (let i = 0; i < 30; i++) {
            let item = document.createElement('div');
            item.className = 'falling-item';
            item.innerHTML = particles[Math.floor(Math.random() * particles.length)];
            item.style.left = (Math.random() * 100) + 'vw';
            item.style.animationDuration = (Math.random() * 12 + 10) + 's';
            item.style.animationDelay = (Math.random() * 10) + 's';
            item.style.width = (Math.random() * 8 + 12) + 'px';
            item.style.height = item.style.width;
            item.style.opacity = Math.random() * 0.3 + 0.1;
            fx.appendChild(item);
        }

        for (let i = 0; i < 15; i++) {
            let firefly = document.createElement('div');
            firefly.className = 'firefly';
            firefly.style.left = (Math.random() * 100) + 'vw';
            firefly.style.top = (Math.random() * 100) + 'vh';
            firefly.style.animationDelay = (Math.random() * 5) + 's';
            firefly.style.animationDuration = (Math.random() * 5 + 5) + 's';
            document.body.appendChild(firefly);
        }

        document.body.addEventListener('click', function(e) {
            if(e.target.closest('BUTTON') || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            let ripple = document.createElement('div');
            ripple.className = 'click-fx';
            ripple.style.left = e.pageX + 'px';
            ripple.style.top = e.pageY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
            if (navigator.vibrate) navigator.vibrate(10);
        });

        const display = document.getElementById('time-display');
        const btnStart = document.getElementById('btn-start');
        const btnReset = document.getElementById('btn-reset');
        const btnPlus = document.getElementById('btn-plus');
        const btnMinus = document.getElementById('btn-minus');
        const bubble = document.getElementById('bubble');
        
        let defaultTime = 25 * 60;
        let timeLeft = defaultTime;
        let timerId = null;
        let isRunning = false;

        const quotes = ["去喝杯水，看看绿植吧 🌿", "深呼吸，别太累了 🍃", "今天也辛苦啦 ✨", "慢一点也没关系 🍀", "伸个懒腰，让眼睛休息一下 👀"];

        function updateUI() {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            display.textContent = (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        function playChime() {
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 1.5);
            } catch (e) {}
        }

        btnStart.addEventListener('click', () => {
            if (isRunning) {
                clearInterval(timerId); isRunning = false; btnStart.textContent = "继续专注";
            } else {
                isRunning = true; btnStart.textContent = "暂停";
                timerId = setInterval(() => {
                    if (timeLeft > 0) { timeLeft--; updateUI(); } 
                    else { clearInterval(timerId); isRunning = false; btnStart.textContent = "开始专注"; timeEnded(); }
                }, 1000);
            }
        });

        btnReset.addEventListener('click', () => {
            clearInterval(timerId); isRunning = false; timeLeft = defaultTime;
            updateUI(); btnStart.textContent = "开始专注";
            display.style.color = "#fff";
        });

        btnPlus.addEventListener('click', () => {
            if(isRunning) return;
            timeLeft += 300; defaultTime += 300; updateUI();
        });

        btnMinus.addEventListener('click', () => {
            if(isRunning) return;
            if(timeLeft > 300) { timeLeft -= 300; defaultTime -= 300; updateUI(); }
        });

        function timeEnded() {
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            playChime();
            bubble.textContent = quotes[Math.floor(Math.random() * quotes.length)];
            bubble.classList.add('show');
            display.style.color = "#7fffd4";
            display.style.textShadow = "0 0 40px #fff, 0 0 80px #7fffd4";

            setTimeout(() => {
                bubble.classList.remove('show');
                display.style.color = "#fff";
                display.style.textShadow = "0 0 20px rgba(168, 230, 207, 0.9), 0 0 40px rgba(127, 255, 212, 0.5)";
                timeLeft = defaultTime; updateUI();
            }, 5000);
        }

        const btnMusic = document.getElementById('btn-toggle-music');
        const btnMemo = document.getElementById('btn-toggle-memo');
        const panelMusic = document.getElementById('panel-music');
        const panelMemo = document.getElementById('panel-memo');

        btnMusic.addEventListener('click', () => {
            panelMusic.style.display = panelMusic.style.display === 'flex' ? 'none' : 'flex';
            panelMemo.style.display = 'none';
        });
        btnMemo.addEventListener('click', () => {
            panelMemo.style.display = panelMemo.style.display === 'flex' ? 'none' : 'flex';
            panelMusic.style.display = 'none';
        });

        const bgm = document.getElementById('bgm');
        const playBtn = document.getElementById('music-play');
        const prevBtn = document.getElementById('music-prev');
        const nextBtn = document.getElementById('music-next');
        const volSlider = document.getElementById('vol-slider');
        const musicTitle = document.getElementById('music-title');

        const playlist = [
            { name: "🌿 呼风唤雨", url: "https://pdftourl.net/audio/1792343598721-a7ab0b2e-ea24-4486-af10-93aaf33439da.m4a" }, 
            { name: "🍀 贩卖焦绿指南", url: "https://pdftourl.net/audio/1792343709810-76a40112-aa72-4197-9e00-7546b9c36f10.m4a" },
            { name: "💭 我想", url: "https://pdftourl.net/audio/1792346925311-529ac94d-cb97-4618-b529-fbf1b0e34406.m4a" },
            { name: "🍃 等风来", url: "https://pdftourl.net/audio/1792347159228-ec53ae0a-e630-43a5-a949-7427935ad8b4.m4a" },
            { name: "🧜‍♀️ 美人鱼", url: "https://pdftourl.net/audio/1792347292454-a7a3be93-7540-4f4d-85e7-33656c313016.m4a" }
        ];
        let currentTrack = 0;

        function loadTrack(index, autoPlay = true) {
            currentTrack = index;
            bgm.src = playlist[index].url;
            musicTitle.textContent = playlist[index].name;
            bgm.load();
            bgm.currentTime = 0;

            if (autoPlay) {
                bgm.play().then(() => { playBtn.textContent = "⏸"; }).catch(() => { playBtn.textContent = "▶"; });
            }
        }

        bgm.src = playlist[0].url;
        musicTitle.textContent = playlist[0].name;

        playBtn.addEventListener('click', () => {
            if (bgm.paused) { 
                bgm.play().then(() => { playBtn.textContent = "⏸"; }).catch(e => alert("音频加载失败，请重试。")); 
            }
            else { bgm.pause(); playBtn.textContent = "▶"; }
        });
        
        nextBtn.addEventListener('click', () => { loadTrack((currentTrack + 1) % playlist.length, true); });
        prevBtn.addEventListener('click', () => { loadTrack((currentTrack - 1 + playlist.length) % playlist.length, true); });
        
        volSlider.addEventListener('input', (e) => { bgm.volume = e.target.value; });
        bgm.addEventListener('ended', () => { nextBtn.click(); });

        const memoText = document.getElementById('memo-text');
        const saveBtn = document.getElementById('btn-save-memo');
        const savedMemo = localStorage.getItem('fresh_memo_v2');
        if (savedMemo) memoText.value = savedMemo;

        saveBtn.addEventListener('click', () => {
            localStorage.setItem('fresh_memo_v2', memoText.value);
            saveBtn.textContent = "已保存 ✨";
            setTimeout(() => saveBtn.textContent = "保存", 1500);
        });

        updateUI();
    </script>
</body>
</html>
